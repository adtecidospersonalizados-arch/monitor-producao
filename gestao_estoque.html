<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Estoque</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
.header{background:#1a1a2e;color:#fff;padding:16px 20px;border-radius:10px;margin-bottom:20px}
.header h1{font-size:18px;font-weight:bold}
.header p{font-size:12px;color:#888;margin-top:4px}
.filtros{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px;border:1px solid #e0e0e0;display:flex;gap:10px;align-items:end}
.fg{display:flex;flex-direction:column;gap:4px;flex:1}
.fg label{font-size:12px;color:#555;font-weight:bold}
.fg input{padding:9px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:Arial;width:100%}
.btn-buscar{padding:9px 20px;background:#1a1a2e;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:bold;cursor:pointer;white-space:nowrap}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.resumo-item{background:#fff;border-radius:8px;padding:12px;text-align:center;border:1px solid #e0e0e0}
.resumo-label{font-size:11px;color:#888;margin-bottom:4px}
.resumo-valor{font-size:22px;font-weight:bold;color:#1a1a2e}
.resumo-valor.amarelo{color:#854F0B}
.resumo-valor.vermelho{color:#8B0000}
.lista{background:#fff;border-radius:10px;border:1px solid #e0e0e0;overflow:hidden}
.lista-header{display:grid;grid-template-columns:80px 1fr 90px 90px 100px 110px;gap:8px;padding:10px 16px;background:#f8f8f8;border-bottom:1px solid #e0e0e0;font-size:11px;font-weight:bold;color:#555}
.produto-row{display:grid;grid-template-columns:80px 1fr 90px 90px 100px 110px;gap:8px;padding:10px 16px;border-bottom:1px solid #f0f0f0;align-items:center}
.produto-row:last-child{border-bottom:none}
.produto-row:hover{background:#fafafa}
.produto-codigo{font-size:12px;font-weight:bold;color:#1a1a2e}
.produto-nome{font-size:12px;color:#333}
.input-edit{font-size:12px;padding:5px 6px;border:1px solid #ddd;border-radius:5px;width:100%;text-align:center}
.badge{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:bold;display:inline-block}
.badge-ok{background:#d6efd8;color:#1a5e2a}
.badge-baixo{background:#fff3cd;color:#854F0B}
.badge-zerado{background:#fddede;color:#8b0000}
.btn-salvar{font-size:11px;padding:5px 10px;background:#1a1a2e;color:#fff;border:none;border-radius:5px;cursor:pointer}
.empty{text-align:center;color:#aaa;font-size:13px;padding:30px}
.loading{text-align:center;color:#888;font-size:13px;padding:30px}
.msg{padding:10px;border-radius:6px;font-size:13px;margin-bottom:12px;display:none}
.msg.ok{background:#d6efd8;color:#1a5e2a}
.msg.erro{background:#fddede;color:#8b0000}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Gestão de Estoque</h1>
    <p>Busque produtos e ajuste quantidade ou mínimo manualmente</p>
  </div>

  <div class="msg" id="msg"></div>

  <div class="filtros">
    <div class="fg">
      <label>Buscar por nome ou código</label>
      <input type="text" id="busca" placeholder="Ex: tecido ou EST-0001" oninput="filtrar()">
    </div>
    <button class="btn-buscar" onclick="carregarTodos()">Atualizar</button>
  </div>

  <div class="resumo" id="resumo"></div>

  <div class="lista">
    <div class="lista-header">
      <div>Código</div>
      <div>Produto</div>
      <div>Qtd atual</div>
      <div>Mínimo</div>
      <div>Status</div>
      <div>Ação</div>
    </div>
    <div id="lista-body"><div class="loading">Carregando produtos...</div></div>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbwLe2DIaIE6Uh4qyjVOfZonmWRbtURtBwOE1s4lqGCLn3tu4Iyf5zptXm7LbOi80DZwDA/exec";
let todosProdutos=[];
let produtosFiltrados=[];

function mostrarMsg(txt,tipo){
  const el=document.getElementById('msg');
  el.textContent=txt;el.className='msg '+tipo;el.style.display='block';
  setTimeout(()=>el.style.display='none',3000);
}

function statusProduto(p){
  if(p.qtd<=0) return 'zerado';
  if(p.minimo>0 && p.qtd<=p.minimo) return 'baixo';
  return 'ok';
}

function badgeStatus(st){
  if(st==='zerado') return '<span class="badge badge-zerado">Zerado</span>';
  if(st==='baixo') return '<span class="badge badge-baixo">Baixo</span>';
  return '<span class="badge badge-ok">Normal</span>';
}

async function carregarTodos(){
  document.getElementById('lista-body').innerHTML='<div class="loading">Carregando...</div>';
  try{
    const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});
    todosProdutos=await r.json();
    if(!Array.isArray(todosProdutos))todosProdutos=[];
    filtrar();
  }catch(e){
    document.getElementById('lista-body').innerHTML='<div class="empty">Erro ao carregar produtos.</div>';
  }
}

function filtrar(){
  const busca=document.getElementById('busca').value.trim().toLowerCase();
  produtosFiltrados=todosProdutos.filter(p=>{
    if(busca && !String(p.nome).toLowerCase().includes(busca) && !String(p.codigo).toLowerCase().includes(busca)) return false;
    return true;
  });
  renderResumo();
  renderLista();
}

function renderResumo(){
  const total=produtosFiltrados.length;
  const baixo=produtosFiltrados.filter(p=>statusProduto(p)==='baixo').length;
  const zerado=produtosFiltrados.filter(p=>statusProduto(p)==='zerado').length;
  document.getElementById('resumo').innerHTML=
    '<div class="resumo-item"><div class="resumo-label">Total</div><div class="resumo-valor">'+total+'</div></div>'+
    '<div class="resumo-item"><div class="resumo-label">Abaixo do mínimo</div><div class="resumo-valor amarelo">'+baixo+'</div></div>'+
    '<div class="resumo-item"><div class="resumo-label">Zerados</div><div class="resumo-valor vermelho">'+zerado+'</div></div>';
}

function renderLista(){
  if(produtosFiltrados.length===0){
    document.getElementById('lista-body').innerHTML='<div class="empty">Nenhum produto encontrado.</div>';
    return;
  }
  document.getElementById('lista-body').innerHTML=produtosFiltrados.map(p=>{
    const st=statusProduto(p);
    return '<div class="produto-row">'+
      '<div class="produto-codigo">'+p.codigo+'</div>'+
      '<div class="produto-nome">'+p.nome+'</div>'+
      '<div><input class="input-edit" type="number" id="qtd-'+p.codigo+'" value="'+p.qtd+'"></div>'+
      '<div><input class="input-edit" type="number" id="min-'+p.codigo+'" value="'+p.minimo+'"></div>'+
      '<div>'+badgeStatus(st)+'</div>'+
      '<div><button class="btn-salvar" onclick="salvar(\''+p.codigo+'\')">Salvar</button></div>'+
      '</div>';
  }).join('');
}

async function salvar(codigo){
  const qtd=document.getElementById('qtd-'+codigo).value;
  const minimo=document.getElementById('min-'+codigo).value;
  try{
    await fetch(API,{method:'POST',body:JSON.stringify({acao:'atualizarProduto',codigo,qtd,minimo})});
    mostrarMsg('Produto '+codigo+' atualizado!','ok');
    await carregarTodos();
  }catch(e){
    mostrarMsg('Erro ao atualizar.','erro');
  }
}

carregarTodos();
setInterval(carregarTodos,60000);
</script>
</body>
</html>
