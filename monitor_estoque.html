<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Estoque</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0f0f14;color:#e8e6e0;font-family:Arial,sans-serif;padding:16px;min-height:100vh}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #2a2a35}
  .title{font-size:22px;font-weight:bold;color:#e8e6e0}
  .subtitle{font-size:13px;color:#666;margin-top:3px}
  .clock-time{font-size:28px;font-weight:bold;color:#e8e6e0}
  .clock-date{font-size:13px;color:#666;margin-top:2px}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .metric{background:#1a1a22;border-radius:8px;padding:12px 16px}
  .metric-label{font-size:12px;color:#666;margin-bottom:4px}
  .metric-value{font-size:30px;font-weight:bold}
  .mv-white{color:#e8e6e0}.mv-warn{color:#f0a030}.mv-danger{color:#e05050}.mv-ok{color:#2ecc8a}
  .produtos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .produto{background:#1a1a22;border-radius:8px;padding:12px 14px}
  .produto.st-ok{border-left:4px solid #2ecc8a}
  .produto.st-baixo{border-left:4px solid #f0a030;animation:piscaAmarelo 1.2s ease-in-out infinite}
  .produto.st-zerado{border-left:4px solid #e05050;animation:piscaVermelho 1.2s ease-in-out infinite}
  @keyframes piscaAmarelo{0%,100%{background:#1a1a22}50%{background:#2a2008}}
  @keyframes piscaVermelho{0%,100%{background:#1a1a22}50%{background:#2a0808}}
  .produto-nome{font-size:13px;font-weight:bold;color:#e8e6e0;margin-bottom:8px;min-height:34px}
  .produto-codigo{font-size:10px;color:#666;margin-bottom:8px}
  .produto-qtd{font-size:32px;font-weight:bold;line-height:1}
  .produto-qtd.ok{color:#2ecc8a}
  .produto-qtd.baixo{color:#f0a030}
  .produto-qtd.zerado{color:#e05050}
  .produto-min{font-size:11px;color:#666;margin-top:4px}
  .legend{display:flex;gap:20px;margin-top:14px;padding-top:10px;border-top:1px solid #2a2a35;justify-content:center}
  .leg{display:flex;align-items:center;gap:6px;font-size:12px;color:#666}
  .leg-dot{width:8px;height:8px;border-radius:50%}
  .update-bar{text-align:center;font-size:11px;color:#444;margin-top:8px}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="title">Monitor de Estoque</div>
    <div class="subtitle" id="subtitle">Conectando...</div>
  </div>
  <div style="text-align:right">
    <div class="clock-time" id="clock-time">--:--</div>
    <div class="clock-date" id="clock-date"></div>
  </div>
</div>
<div class="metrics" id="metrics"></div>
<div class="produtos" id="produtos"></div>
<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:#2ecc8a"></div>Estoque normal</div>
  <div class="leg"><div class="leg-dot" style="background:#f0a030"></div>Abaixo do mínimo</div>
  <div class="leg"><div class="leg-dot" style="background:#e05050"></div>Zerado</div>
</div>
<div class="update-bar" id="update-bar">Atualizando...</div>
<script>
const API="https://script.google.com/macros/s/AKfycbwLe2DIaIE6Uh4qyjVOfZonmWRbtURtBwOE1s4lqGCLn3tu4Iyf5zptXm7LbOi80DZwDA/exec";
let produtos=[];

async function fetchData(){
  try{
    const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});
    const p=await r.json();
    if(Array.isArray(p)){
      produtos=p;
      document.getElementById('subtitle').textContent='Dados ao vivo — Google Sheets';
    }
  }catch(e){
    document.getElementById('subtitle').textContent='Erro de conexão — tentando novamente...';
  }
}

function statusProduto(p){
  if(p.qtd<=0) return 'zerado';
  if(p.minimo>0 && p.qtd<=p.minimo) return 'baixo';
  return 'ok';
}

function render(){
  const now=new Date();
  document.getElementById('clock-time').textContent=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('clock-date').textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
  document.getElementById('update-bar').textContent='Última atualização: '+now.toLocaleTimeString('pt-BR');

  const baixo=produtos.filter(p=>statusProduto(p)==='baixo').length;
  const zerado=produtos.filter(p=>statusProduto(p)==='zerado').length;

  document.getElementById('metrics').innerHTML=
    '<div class="metric"><div class="metric-label">Total de produtos</div><div class="metric-value mv-white">'+produtos.length+'</div></div>'+
    '<div class="metric"><div class="metric-label">Abaixo do mínimo</div><div class="metric-value mv-warn">'+baixo+'</div></div>'+
    '<div class="metric"><div class="metric-label">Zerados</div><div class="metric-value mv-danger">'+zerado+'</div></div>';

  const ordenados=produtos.slice().sort((a,b)=>{
    const sa=statusProduto(a), sb=statusProduto(b);
    const ordem={zerado:0,baixo:1,ok:2};
    return ordem[sa]-ordem[sb];
  });

  document.getElementById('produtos').innerHTML=ordenados.map(p=>{
    const st=statusProduto(p);
    return '<div class="produto st-'+st+'">'+
      '<div class="produto-nome">'+p.nome+'</div>'+
      '<div class="produto-codigo">'+p.codigo+'</div>'+
      '<div class="produto-qtd '+st+'">'+p.qtd+'</div>'+
      '<div class="produto-min">Mínimo: '+p.minimo+'</div>'+
      '</div>';
  }).join('');
}

async function atualizar(){await fetchData();render();}
atualizar();
setInterval(atualizar,30000);
setInterval(()=>{
  const n=new Date();
  document.getElementById('clock-time').textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
},1000);
</script>
</body>
</html>
