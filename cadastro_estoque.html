<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Produtos — Almoxarifado</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;min-height:100vh;padding:20px}
.container{max-width:500px;margin:0 auto}
.header{background:#1a1a2e;color:#fff;padding:16px 20px;border-radius:10px;margin-bottom:20px}
.header h1{font-size:18px;font-weight:bold}
.header p{font-size:12px;color:#888;margin-top:4px}
.card{background:#fff;border-radius:10px;padding:20px;border:1px solid #e0e0e0}
.card h2{font-size:14px;font-weight:bold;color:#1a1a2e;margin-bottom:14px}
.form-group{margin-bottom:12px}
.form-group label{font-size:12px;color:#555;display:block;margin-bottom:4px;font-weight:bold}
.form-group input{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:Arial}
.btn-cadastrar{width:100%;padding:12px;background:#1a1a2e;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;margin-top:4px}
.btn-cadastrar:disabled{background:#aaa;cursor:not-allowed}
.msg{padding:10px;border-radius:6px;font-size:13px;margin-bottom:12px;display:none}
.msg.ok{background:#d6efd8;color:#1a5e2a}
.msg.erro{background:#fddede;color:#8b0000}
.qr-area{display:none;text-align:center;margin-top:16px}
.qr-area h3{font-size:14px;color:#1a1a2e;margin-bottom:12px}
.qr-box{display:inline-block;padding:16px;border:2px solid #1a1a2e;border-radius:10px;margin-bottom:12px;background:#fff}
.produto-info{background:#f0f4ff;border-radius:8px;padding:12px;text-align:left;margin-bottom:12px}
.produto-info p{font-size:12px;color:#333;margin-bottom:4px}
.produto-info p strong{color:#1a1a2e}
.btns{display:flex;gap:8px;justify-content:center}
.btn-imprimir{padding:10px 20px;background:#2ecc8a;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer}
.btn-novo{padding:10px 20px;background:#fff;color:#1a1a2e;border:2px solid #1a1a2e;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer}
.links{text-align:center;margin-top:16px;font-size:12px;color:#888;display:flex;justify-content:center;gap:16px}
.links a{color:#1a1a2e;font-weight:bold;text-decoration:none}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Cadastro de Produtos</h1>
    <p>Registre o produto e imprima o QR Code para colar na embalagem ou local</p>
  </div>

  <div class="card">
    <h2>Novo produto</h2>
    <div class="msg" id="msg"></div>
    <div id="form-area">
      <div class="form-group">
        <label>Nome do produto</label>
        <input type="text" id="nome" placeholder="Ex: Tecido oxford branco">
      </div>
      <div class="form-group">
        <label>Quantidade inicial em estoque</label>
        <input type="number" id="qtdInicial" placeholder="Ex: 50" min="0">
      </div>
      <div class="form-group">
        <label>Quantidade mínima (alerta de estoque baixo)</label>
        <input type="number" id="minimo" placeholder="Ex: 10" min="0">
      </div>
      <button class="btn-cadastrar" id="btn-cadastrar" onclick="cadastrar()">Cadastrar e gerar QR Code</button>
    </div>

    <div class="qr-area" id="qr-area">
      <h3>QR Code gerado — imprima e cole no produto</h3>
      <div class="qr-box" id="qr-code"></div>
      <div class="produto-info" id="produto-info"></div>
      <div class="btns">
        <button class="btn-imprimir" onclick="imprimir()">Imprimir QR Code</button>
        <button class="btn-novo" onclick="novoProduto()">Novo produto</button>
      </div>
    </div>
  </div>

  <div class="links">
    <a href="gestao_estoque.html">Gestão de Estoque →</a>
    <a href="monitor_estoque.html">Monitor de Estoque →</a>
  </div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbwLe2DIaIE6Uh4qyjVOfZonmWRbtURtBwOE1s4lqGCLn3tu4Iyf5zptXm7LbOi80DZwDA/exec";

function mostrarMsg(txt,tipo){
  const el=document.getElementById('msg');
  el.textContent=txt;el.className='msg '+tipo;el.style.display='block';
  setTimeout(()=>el.style.display='none',4000);
}

async function cadastrar(){
  const nome=document.getElementById('nome').value.trim();
  const qtdInicial=document.getElementById('qtdInicial').value;
  const minimo=document.getElementById('minimo').value;
  if(!nome){mostrarMsg('Informe o nome do produto!','erro');return;}
  const btn=document.getElementById('btn-cadastrar');
  btn.disabled=true;btn.textContent='Cadastrando...';
  try{
    const resp=await fetch(API,{method:'POST',body:JSON.stringify({acao:'cadastrarProduto',nome,qtdInicial,minimo})});
    const result=await resp.json();
    if(result.ok){
      gerarQR(result.codigo,nome,qtdInicial,minimo);
    }else{
      mostrarMsg('Erro ao cadastrar. Tente novamente.','erro');
    }
  }catch(e){
    mostrarMsg('Erro de conexão. Verifique a internet.','erro');
  }
  btn.disabled=false;btn.textContent='Cadastrar e gerar QR Code';
}

function gerarQR(codigo,nome,qtdInicial,minimo){
  document.getElementById('form-area').style.display='none';
  document.getElementById('qr-area').style.display='block';
  document.getElementById('qr-code').innerHTML='';
  new QRCode(document.getElementById('qr-code'),{
    text:codigo,
    width:180,height:180,
    colorDark:"#1a1a2e",colorLight:"#ffffff",
    correctLevel:QRCode.CorrectLevel.M
  });
  document.getElementById('produto-info').innerHTML=
    '<p><strong>Código:</strong> '+codigo+'</p>'+
    '<p><strong>Produto:</strong> '+nome+'</p>'+
    '<p><strong>Quantidade inicial:</strong> '+(qtdInicial||0)+'</p>'+
    '<p><strong>Mínimo:</strong> '+(minimo||0)+'</p>';
}

function novoProduto(){
  document.getElementById('form-area').style.display='block';
  document.getElementById('qr-area').style.display='none';
  document.getElementById('nome').value='';
  document.getElementById('qtdInicial').value='';
  document.getElementById('minimo').value='';
  document.getElementById('nome').focus();
}

function imprimir(){
  const qrEl=document.getElementById('qr-code');
  const infoEl=document.getElementById('produto-info');
  const win=window.open('','_blank','width=400,height=500');
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>QR Code Produto</title>'+
    '<style>body{font-family:Arial,sans-serif;padding:20px;text-align:center}'+
    '.qr-box{display:inline-block;padding:16px;border:2px solid #1a1a2e;border-radius:10px;margin-bottom:12px}'+
    '.info{background:#f0f4ff;border-radius:8px;padding:12px;text-align:left;font-size:13px}'+
    '.info p{margin-bottom:4px}strong{color:#1a1a2e}'+
    'h2{color:#1a1a2e;margin-bottom:16px;font-size:16px}</style></head><body>'+
    '<h2>QR Code do Produto</h2>'+
    '<div class="qr-box">'+qrEl.innerHTML+'</div>'+
    '<div class="info">'+infoEl.innerHTML+'</div>'+
    '<script>window.onload=function(){window.print();}<\/script>'+
    '</body></html>');
  win.document.close();
}
</script>
</body>
</html>
